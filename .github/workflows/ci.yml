name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux / ${{ matrix.dc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dc: [dmd-latest, ldc-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Build
        run: dub build

      - name: Unit tests
        run: dub test

      - name: Stress test
        shell: bash
        run: |
          dub build --single tests/stress.d
          ./tests/stress
          ./tests/stress --lock

      - name: Stress test, consumers in separate PID namespaces (like containers)
        run: sudo ./tests/stress --lock --spawn="unshare --pid --fork --kill-child"

  macos:
    name: macOS / ldc-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build
        run: dub build

      - name: Unit tests
        run: dub test

      - name: Stress test
        shell: bash
        run: |
          dub build --single tests/stress.d
          ./tests/stress
          ./tests/stress --lock

  windows:
    name: Windows / ${{ matrix.dc }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dc: [dmd-latest, ldc-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Build
        run: dub build

      - name: Unit tests
        run: dub test

      - name: Stress test
        shell: bash
        run: |
          dub build --single tests/stress.d
          ./tests/stress
          ./tests/stress --lock
